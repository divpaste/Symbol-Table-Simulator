<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Symbol Table Simulator</title>
  <style>
    :root {
      --bg: #ece7de;
      --paper: #f7f4ed;
      --paper-elevated: #ffffff;
      --ink: #1e2229;
      --ink-muted: #5e6676;
      --ink-faint: #d3ccc0;
      --shadow: 3px 3px 0px #1e2229;
      --shadow-hover: 4px 4px 0px #1e2229;
      --border-thick: 2.5px solid #1e2229;
      --collision-bg: #dfd8cb;
      --code-highlight: rgba(254, 240, 138, 0.22); /* Marker highlight color */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: var(--border-thick);
    }

    /* Top Comic Bar */
    header {
      height: 54px;
      border-bottom: var(--border-thick);
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid var(--ink);
      background: var(--bg);
    }

    .btn-compile {
      background: var(--paper-elevated);
      color: var(--ink);
      border: var(--border-thick);
      padding: 6px 20px;
      font-size: 0.95rem;
      font-weight: 900;
      font-family: inherit;
      border-radius: 10px 5px 12px 6px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .btn-compile:hover {
      box-shadow: var(--shadow-hover);
      transform: translate(-1.5px, -1.5px);
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* Left Panel: C Code Editor with Synchronized Highlight Layer */
    .left-panel {
      border-right: var(--border-thick);
      display: flex;
      flex-direction: column;
      background: #1b2028;
    }

    .editor-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      overflow-y: auto;
    }

    .line-numbers {
      width: 44px;
      padding: 14px 0;
      text-align: right;
      color: #5d6778;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.6;
      user-select: none;
      border-right: 1.5px dashed #2f3746;
      padding-right: 10px;
      z-index: 2;
    }

    .editor-stage {
      position: relative;
      flex: 1;
      min-height: 100%;
    }

    /* Background Highlight Layer */
    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      pointer-events: none;
      z-index: 1;
      white-space: pre;
    }

    .line-row {
      height: calc(0.95rem * 1.6);
      width: 100%;
    }

    .line-row.active-scope {
      background: var(--code-highlight);
      border-left: 3px solid #facc15;
    }

    .code-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e3e7ee;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.6;
      padding: 14px;
      resize: none;
      white-space: pre;
      z-index: 2;
    }

    .diagnostic-bar {
      padding: 8px 16px;
      background: var(--paper);
      border-top: var(--border-thick);
      font-size: 0.85rem;
      font-family: monospace;
      font-weight: bold;
      min-height: 36px;
      color: var(--ink);
    }
    .diag-success { color: var(--ink); }
    .diag-error { color: #b91c1c; text-decoration: underline wavy #b91c1c; }

    /* Right Panel */
    .right-panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 18px;
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px dashed var(--ink-faint);
    }

    .view-title { font-size: 1.05rem; font-weight: 900; }

    .btn-back {
      background: var(--paper-elevated);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0px var(--ink);
      padding: 5px 12px;
      border-radius: 6px 3px 6px 3px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 800;
      font-family: inherit;
    }
    .btn-back:hover {
      box-shadow: 3px 3px 0px var(--ink);
      transform: translate(-1.5px, -1.5px);
    }

    /* SLIDE 1: Scope Circles */
    .scope-tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .scope-circle {
      width: 95px;
      height: 95px;
      border-radius: 50% 48% 52% 49% / 51% 53% 47% 49%;
      border: 2px solid var(--ink);
      background: var(--paper-elevated);
      box-shadow: 2.5px 2.5px 0px var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      text-align: center;
      padding: 6px;
    }

    .scope-circle:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 3.5px 3.5px 0px var(--ink);
    }

    .scope-circle .id-tag { font-weight: 900; font-size: 1rem; color: var(--ink); }
    .scope-circle .name-tag { font-size: 0.75rem; font-weight: 700; color: var(--ink-muted); margin-top: 2px; }
    .tree-arrow { font-size: 1.3rem; font-weight: 900; color: var(--ink); user-select: none; }

    /* SLIDE 2: Hash Table Rows */
    .hash-table { display: flex; flex-direction: column; gap: 8px; }

    .bucket-row {
      display: grid;
      grid-template-columns: 65px 1fr 30px;
      align-items: center;
      height: 38px;
      background: var(--paper-elevated);
      border: 2px solid var(--ink);
      border-radius: 6px 8px 5px 6px;
      box-shadow: 2px 2px 0px var(--ink);
      padding: 0 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: bold;
      user-select: none;
    }

    .bucket-idx { color: var(--ink); font-weight: 900; }
    .bucket-content { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bucket-row.collision {
      background: var(--collision-bg);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0px var(--ink);
      cursor: pointer;
    }
    .bucket-row.collision:hover {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 4px 4px 0px var(--ink);
    }
    .bucket-row.collision .bucket-content { font-weight: 900; text-decoration: underline; }
    .bucket-action-arrow { display: none; font-size: 1.1rem; font-weight: 900; text-align: right; }
    .bucket-row.collision .bucket-action-arrow { display: block; }

    /* SLIDE 3: Linked List Node Boxes */
    .chain-view { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    .bucket-head {
      background: var(--paper-elevated);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0px var(--ink);
      font-family: monospace;
      font-weight: 900;
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .node-box {
      width: 220px;
      background: var(--paper-elevated);
      border: 2px solid var(--ink);
      box-shadow: 2.5px 2.5px 0px var(--ink);
      border-radius: 6px 5px 7px 5px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: monospace;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .node-field { display: flex; justify-content: space-between; }
    .node-field .field-name { color: var(--ink-muted); }
    .node-field .field-val { color: var(--ink); font-weight: 900; }

    .null-box {
      background: var(--paper-elevated);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0px var(--ink);
      font-family: monospace;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      <span>Symbol Table Simulator</span>
    </div>
    <button class="btn-compile" onclick="compileWithPython()">Compile</button>
  </header>

  <div class="workspace">
    <div class="left-panel">
      <div class="editor-wrapper">
        <div class="line-numbers" id="line-numbers"></div>
        <div class="editor-stage">
          <!-- Background row highlights -->
          <div class="highlight-layer" id="highlight-layer"></div>
          <!-- Code textarea -->
          <textarea class="code-input" id="c-code" spellcheck="false" oninput="syncEditor()"></textarea>
        </div>
      </div>
      <div class="diagnostic-bar" id="diagnostic">Ready. Click Compile.</div>
    </div>

    <div class="right-panel" id="right-panel"></div>
  </div>

  <script>
    const DEFAULT_CODE = `int a = 1;
int h = 2;
int flag = 0;

void process(int input_val)
{
    int b = 10;
    int i = 20;

    {
        int temp = 50;
        int limit = 100;
    }
}`;

    let scopesData = [];
    let activeScope = null;
    let activeBucketIdx = null;

    // Synchronizes line numbers & highlight rows
    function syncEditor() {
      const code = document.getElementById("c-code").value;
      const count = code.split("\n").length;
      
      let nums = "";
      let rows = "";
      for (let i = 1; i <= count; i++) {
        nums += i + "<br>";
        rows += `<div class="line-row" id="line-row-${i}"></div>`;
      }
      document.getElementById("line-numbers").innerHTML = nums;
      document.getElementById("highlight-layer").innerHTML = rows;

      // Re-apply highlight if a scope is currently active
      if (activeScope && activeScope.scope_id !== "S0") {
        highlightScopeLines(activeScope.start_line, activeScope.end_line);
      }
    }

    function highlightScopeLines(start, end) {
      clearHighlights();
      for (let i = start; i <= end; i++) {
        const el = document.getElementById(`line-row-${i}`);
        if (el) el.classList.add("active-scope");
      }
    }

    function clearHighlights() {
      document.querySelectorAll(".line-row").forEach(r => r.classList.remove("active-scope"));
    }

    async function compileWithPython() {
      const code = document.getElementById("c-code").value;
      try {
        const response = await fetch("/api/compile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });
        const data = await response.json();

        scopesData = data.scopes;
        const diag = document.getElementById("diagnostic");

        if (data.errors && data.errors.length > 0) {
          diag.className = "diagnostic-bar diag-error";
          diag.innerHTML = `⚠️ ${data.errors.join(" | ")}`;
        } else {
          diag.className = "diagnostic-bar diag-success";
          diag.innerHTML = `✓ Parsed with Python backend. Total scopes: ${scopesData.length}`;
        }

        showSlide1();
      } catch (err) {
        document.getElementById("diagnostic").innerHTML = "Error connecting to backend: " + err;
      }
    }

    // SLIDE 1: Scope Tree (Clears Highlights)
    function showSlide1() {
      activeScope = null;
      activeBucketIdx = null;
      clearHighlights();

      const panel = document.getElementById("right-panel");
      let html = `
        <div class="view-header">
          <div class="view-title">Scope Tree</div>
        </div>
        <div class="scope-tree-container">
      `;
      scopesData.forEach((sc, i) => {
        html += `
          <div class="scope-circle" onclick="showSlide2('${sc.scope_id}')">
            <div class="id-tag">${sc.scope_id}</div>
            <div class="name-tag">${sc.scope_name}</div>
          </div>
        `;
        if (i < scopesData.length - 1) html += `<div class="tree-arrow">↓</div>`;
      });
      html += `</div>`;
      panel.innerHTML = html;
    }

    // SLIDE 2: Scope Table (Highlights code of this scope)
    function showSlide2(scopeId) {
      activeScope = scopesData.find(s => s.scope_id === scopeId);
      
      // Highlight lines for non-global scopes
      if (activeScope.scope_id !== "S0") {
        highlightScopeLines(activeScope.start_line, activeScope.end_line);
      } else {
        clearHighlights();
      }

      const panel = document.getElementById("right-panel");
      let html = `
        <div class="view-header">
          <button class="btn-back" onclick="showSlide1()">← Back to Tree</button>
          <div class="view-title">${activeScope.scope_id}: ${activeScope.scope_name} Table</div>
        </div>
        <div class="hash-table">
      `;

      activeScope.buckets.forEach(b => {
        const isCollision = b.chain.length > 1;
        const rowClass = isCollision ? "bucket-row collision" : "bucket-row";
        const clickAttr = isCollision ? `onclick="showSlide3(${b.index})"` : "";
        let content = b.chain.length > 0 ? `${b.chain[0].name} : ${b.chain[0].data_type}` : "";

        html += `
          <div class="${rowClass}" ${clickAttr}>
            <span class="bucket-idx">[ ${b.index} ]</span>
            <span class="bucket-content">${content}</span>
            <span class="bucket-action-arrow">➔</span>
          </div>
        `;
      });

      html += `</div>`;
      panel.innerHTML = html;
    }

    // SLIDE 3: Chaining (Retains code highlight)
    function showSlide3(bucketIdx) {
      activeBucketIdx = bucketIdx;
      const bucket = activeScope.buckets.find(b => b.index === bucketIdx);
      const panel = document.getElementById("right-panel");

      let html = `
        <div class="view-header">
          <button class="btn-back" onclick="showSlide2('${activeScope.scope_id}')">← Back to Table</button>
          <div class="view-title">Separate Chaining: Bucket [ ${bucketIdx} ]</div>
        </div>
        <div class="chain-view">
          <div class="bucket-head">Bucket [ ${bucketIdx} ]</div>
          <div class="tree-arrow">↓</div>
      `;

      bucket.chain.forEach(sym => {
        html += `
          <div class="node-box">
            <div class="node-field"><span class="field-name">Identifier:</span><span class="field-val">${sym.name}</span></div>
            <div class="node-field"><span class="field-name">Data Type:</span><span class="field-val">${sym.data_type}</span></div>
            <div class="node-field"><span class="field-name">Value:</span><span class="field-val">${sym.value !== null ? sym.value : "—"}</span></div>
          </div>
          <div class="tree-arrow">↓</div>
        `;
      });

      html += `<div class="null-box">NULL</div></div>`;
      panel.innerHTML = html;
    }

    window.onload = () => {
      document.getElementById("c-code").value = DEFAULT_CODE;
      syncEditor();
      compileWithPython();
    };
  </script>
</body>
</html>
